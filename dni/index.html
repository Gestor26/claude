<script>
const CONFIG = {
  // Pegá acá la URL de la aplicación web de Google Apps Script (termina en /exec).
  // Si queda vacío, la página lee stock.xlsx de la misma carpeta.
  API_URL: 'https://script.google.com/macros/s/AKfycbx4GT_AVI-xSRIeH6J1kE8Xkh-GlWKFW5ezCuZVDJhohtVFFW9XjQW8GH9iQWiYAO-zSg/exec',
  ARCHIVO_EXCEL: 'stock.xlsx',
  WHATSAPP: '5493413105554',             // sin +, sin espacios
  NOMBRE: 'Farroyo',
  // Financiación con DNI: multiplicador sobre el precio contado (no se muestra al cliente)
  PLANES: [ {n:3, f:1.45}, {n:6, f:1.84}, {n:12, f:2.56} ],
  DOLAR_FIJO: null,                      // forzar una cotización (ej: 1600). null = automático
  DOLAR_RESPALDO: 1566,                  // solo si falla todo lo demás
  REDONDEO_PESOS: 100,                   // redondea los pesos hacia arriba a múltiplos de esto
  ORDEN_CATEGORIAS: ['iPhone','MacBook','iPad','AirPods','Apple Watch','Otros']
};

/* ============================================================
   Utilidades de la página
   ============================================================ */
const $ = s => document.querySelector(s);
const fmtUSD = n => 'USD ' + Math.ceil(n).toLocaleString('es-AR');
const fmtARS = n => '$ ' + (Math.ceil(n / CONFIG.REDONDEO_PESOS) * CONFIG.REDONDEO_PESOS).toLocaleString('es-AR');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hhmm = d => new Date(d).toLocaleTimeString('es-AR', {hour:'2-digit', minute:'2-digit', hourCycle:'h23'});
async function withTimeout(p, ms){ return Promise.race([p, new Promise((_,r)=>setTimeout(()=>r(new Error('timeout')), ms))]); }

/* ============================================================
   NÚCLEO COMPARTIDO (idéntico en la página y en Google Apps Script)
   ============================================================ */
const norm = s => String(s == null ? '' : s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();

function parseNum(v){
  if (typeof v === 'number') return v;
  let s = String(v == null ? '' : v).replace(/[^\d.,-]/g,'');
  if (!s) return NaN;
  if (/^\d{1,3}(\.\d{3})+(,\d+)?$/.test(s)) s = s.replace(/\./g,'').replace(',','.');      // 1.250,50
  else if (/^\d{1,3}(,\d{3})+(\.\d+)?$/.test(s)) s = s.replace(/,/g,'');                   // 1,250.50
  else s = s.replace(',','.');
  return parseFloat(s);
}

// Dólar blue Rosario, precio de venta, desde el HTML de InfoDolar
function parseInfoDolar(html){
  const i = html.search(/Blue[\s\S]{0,300}?en Rosario/i);
  if (i < 0) return null;
  let seg = html.slice(i, i + 6000);
  const c = seg.search(/colCompraVenta/i); if (c < 0) return null;   // salta el encabezado de la tabla
  seg = seg.slice(c);
  const end = seg.search(/<\/tr>/i); if (end > 0) seg = seg.slice(0, end);
  const rx = /\$\s*([\d.]+,\d{2})/g, vals = [];
  let m; while ((m = rx.exec(seg))) { const n = parseNum(m[1]); if (n > 100) vals.push(n); }
  return vals.length ? Math.max.apply(null, vals) : null;   // venta = el mayor de compra/venta
}

/* Lectura de la planilla
   Formato de las planillas de Farroyo: una fila por unidad (IMEI).
   Las columnas se reconocen por su contenido, no por el título.
   Solo se publican unidades "Disponible" con precio; se excluyen
   reservados, señados, en reparación y las secciones Outlet / Revisión.
   ============================================================ */
const EXCLUIR = /reparac|reserv|senad|no ofrecer|revision/;
const SECCION_EXCLUIDA = /outle|revision|reparac|reserv/;

function detectCategory(text){
  const t = norm(text);
  if (/iphone|^ip\b|\bip\s/.test(t)) return 'iPhone';
  if (/macbook|\bmac\b|imac/.test(t)) return 'MacBook';
  if (/ipad/.test(t)) return 'iPad';
  if (/airpod/.test(t)) return 'AirPods';
  if (/watch/.test(t)) return 'Apple Watch';
  return null;
}
function detectCondition(text){
  const t = norm(text);
  if (/open/.test(t)) return 'Open box';
  if (/usad|used|semi|reacond/.test(t)) return 'Usado';
  if (/sellad|nuevo|new|sealed/.test(t)) return 'Sellado';
  return null;
}

function detectColumns(header, data){
  const ncol = Math.max(header.length, ...data.slice(0, 50).map(r => r.length));
  const frac = (i, rx) => {
    const v = data.map(r => String(r[i] == null ? '' : r[i]).trim()).filter(Boolean).slice(0, 300);
    return v.length ? v.filter(x => rx.test(norm(x))).length / v.length : 0;
  };
  const m = { obs: [] };
  for (let i = 0; i < ncol; i++){
    const h = norm(header[i]);
    if (m.modelo === undefined && /^(modelo|equipo|producto)/.test(h)) m.modelo = i;
    if (m.color === undefined && /^color/.test(h)) m.color = i;
    if (m.bateria === undefined && /bater|salud/.test(h)) m.bateria = i;
    if (/obs|reserva|nota/.test(h)) m.obs.push(i);
  }
  for (let i = 0; i < ncol; i++){
    if ([m.modelo, m.color, m.bateria].includes(i) || m.obs.includes(i)) continue;
    if (m.precio === undefined && frac(i, /^(u\$s|usd|\$)\s?[\d.,]+$/) > .6) m.precio = i;
    else if (m.gb === undefined && frac(i, /^\d+\s?(gb|tb)\b/) > .6) m.gb = i;
    else if (m.estado === undefined && frac(i, /^(disponible|reparacion|reservado|vendido|senado)/) > .6) m.estado = i;
    else if (m.cond === undefined && frac(i, /(sellad|open box|usad)/) > .6) m.cond = i;
  }
  if (m.modelo === undefined) m.modelo = 0;
  return m;
}

function cleanModel(s, cat){
  let t = String(s).replace(/\s+/g, ' ').trim()
    .replace(/^apple (?=ipad|airpods|iphone|macbook)/i, '')
    .replace(/^iphone/i, 'iPhone').replace(/^ipad/i, 'iPad').replace(/^macbook/i, 'MacBook').replace(/^airpods/i, 'AirPods');
  if (cat === 'iPhone' && !/^iphone/i.test(t)) t = 'iPhone ' + t;
  return t;
}
function cleanGB(s){
  const parts = String(s).split('/').map(p => p.trim()).filter(Boolean)
    .map(p => p.replace(/(\d)\s*(gb|tb)\b/i, (_, d, u) => d + ' ' + u.toUpperCase()).replace(/(\d+(?:,\d)?)\s*pulgadas/i, '$1"'));
  if (parts.length >= 2 && /GB/.test(parts[1])) parts[1] += ' RAM';
  return parts.join(' | ').replace(/^1024 GB$/, '1 TB');
}
const titleCase = s => String(s).trim().toLowerCase().replace(/(^|\s)\S/g, c => c.toUpperCase());

// sheets: [{name, rows}] — rows como texto, tal cual se ve en la planilla
function parseSheets(sheets){
  const units = [];
  sheets.forEach(({name: sheetName, rows}) => {
    const sheetCat = detectCategory(sheetName);
    if (!sheetCat) return;                       // solo pestañas de productos
    const sheetCond = detectCondition(sheetName);
    if (rows.length < 2) return;
    const m = detectColumns(rows[0], rows.slice(1));
    if (m.precio === undefined) return;
    let excluida = false;
    rows.slice(1).forEach(r => {
      const cell = i => i === undefined ? '' : String(r[i] == null ? '' : r[i]).trim();
      const filled = r.filter(c => String(c).trim() && !/^(true|false)$/i.test(String(c).trim()));
      const modeloRaw = cell(m.modelo);
      // fila título de sección (ej. "Outleet", "Equipos en Revision")
      if (filled.length === 1 && modeloRaw){ excluida = SECCION_EXCLUIDA.test(norm(modeloRaw)); return; }
      if (excluida || !modeloRaw) return;
      const precio = parseNum(cell(m.precio));
      if (!(precio > 0)) return;
      const estado = cell(m.estado), obs = m.obs.map(cell).filter(Boolean).join(' ');
      // En reparación solo por batería (sin otras fallas ni observaciones) se publica como disponible
      const tipo = norm(cell(m.cond));
      const reparBateria = /reparac/.test(norm(estado)) && /bateria/.test(tipo) && !/pantalla|camara/.test(tipo) && !obs;
      if (m.estado !== undefined && !/disponible/i.test(estado) && !reparBateria) return;
      if (EXCLUIR.test(norm(modeloRaw + ' ' + (reparBateria ? '' : estado) + ' ' + obs))) return;

      const cat = detectCategory(modeloRaw) || sheetCat;
      let bat = parseNum(cell(m.bateria)); bat = bat > 0 && bat <= 100 ? Math.round(bat) : null;
      units.push({
        cat,
        cond: detectCondition(cell(m.cond)) || sheetCond || (bat ? 'Usado' : 'Sellado'),
        modelo: cleanModel(modeloRaw, cat),
        gb: cleanGB(cell(m.gb)),
        color: cell(m.color) ? titleCase(cell(m.color)) : '',
        bat, precio,
        nota: /pantalla desconocida/i.test(obs) ? 'Pantalla no original' : ''
      });
    });
  });

  // Agrupa unidades iguales (mismo modelo, capacidad, condición, precio y nota)
  const map = new Map();
  units.forEach(u => {
    const k = [u.cat, u.cond, norm(u.modelo), u.gb, u.precio, u.nota].join('|');
    let g = map.get(k);
    if (!g) map.set(k, g = {cat:u.cat, cond:u.cond, modelo:u.modelo, gb:u.gb, precio:u.precio, nota:u.nota, colores:[], bats:[], n:0});
    g.n++;
    if (u.color && !g.colores.some(c => norm(c) === norm(u.color))) g.colores.push(u.color);
    if (u.bat) g.bats.push(u.bat);
  });
  return [...map.values()].map(g => ({
    ...g,
    color: g.colores.join(', '),
    bat: g.bats.length ? (Math.min(...g.bats) === Math.max(...g.bats) ? `${g.bats[0]}%` : `${Math.min(...g.bats)}% a ${Math.max(...g.bats)}%`) : ''
  }));
}


function parseWorkbook(wb){
  return parseSheets(wb.SheetNames.map(name => ({
    name, rows: XLSX.utils.sheet_to_json(wb.Sheets[name], {header:1, defval:'', raw:false})
  })));
}

/* ============================================================
   Dólar sin Apps Script (respaldo)
   ============================================================ */
const INFODOLAR = 'https://www.infodolar.com/cotizacion-dolar-localidad-rosario-provincia-santa-fe.aspx';
const PROXIES = [
  u => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u),
  u => 'https://corsproxy.io/?url=' + encodeURIComponent(u),
  u => 'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(u)
];
async function getDolar(){
  if (CONFIG.DOLAR_FIJO) return {valor: CONFIG.DOLAR_FIJO, fuente: 'fijo'};
  try{
    const c = JSON.parse(localStorage.getItem('farroyo_dolar') || 'null');
    if (c && Date.now() - c.t < 20*60*1000) return c.d;
  }catch(e){}
  let d = null;
  for (const p of PROXIES){
    try{
      const r = await withTimeout(fetch(p(INFODOLAR)), 7000);
      if (!r.ok) continue;
      const v = parseInfoDolar(await r.text());
      if (v){ d = {valor: v, fuente: 'rosario'}; break; }
    }catch(e){}
  }
  if (!d){
    try{
      const r = await withTimeout(fetch('https://dolarapi.com/v1/dolares/blue'), 6000);
      const j = await r.json();
      if (j && j.venta) d = {valor: j.venta, fuente: 'blue'};
    }catch(e){}
  }
  if (!d) d = {valor: CONFIG.DOLAR_RESPALDO, fuente: 'respaldo'};
  d.hora = hhmm(Date.now());
  if (d.fuente !== 'respaldo') try{ localStorage.setItem('farroyo_dolar', JSON.stringify({t:Date.now(), d})); }catch(e){}
  return d;
}

/* ============================================================
   Estadísticas (visitas y clics en Contactanos)
   ============================================================ */
function track(evento, detalle){
  if (!CONFIG.API_URL) return;
  try{
    fetch(`${CONFIG.API_URL}?evento=${evento}&detalle=${encodeURIComponent(detalle || '')}`, {mode:'no-cors', keepalive:true});
  }catch(e){}
}

/* ============================================================
   Render
   ============================================================ */
const S = { items: [], dolar: null, actualizado: null, cat: null, cond: 'Todos', q: '', tope: '', moneda: 'USD' };
const COND_ORDEN = ['Sellado','Open box','Usado'];
const COND_TITULO = {'Sellado':'Nuevos sellados','Open box':'Open box','Usado':'Usados seleccionados'};

function cuotas(precio){
  return CONFIG.PLANES.map(p => {
    const usd = precio * p.f / p.n;
    return { n: p.n, usd, ars: usd * S.dolar.valor };
  });
}

const hayTope = () => parseNum(S.tope) > 0;
function enTope(c){
  const v = parseNum(S.tope);
  if (!(v > 0)) return true;
  return S.moneda === 'USD' ? Math.ceil(c.usd) <= v
    : Math.ceil(c.ars / CONFIG.REDONDEO_PESOS) * CONFIG.REDONDEO_PESOS <= v;
}
const topeTxt = () => S.moneda === 'USD' ? 'USD ' + S.tope : '$ ' + S.tope;

function renderActualizado(){
  const el = $('#actualizado');
  if (!S.actualizado){ el.parentElement.hidden = true; return; }
  const d = new Date(S.actualizado), hoy = new Date();
  const dia = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const diff = Math.round((new Date(hoy.getFullYear(), hoy.getMonth(), hoy.getDate()) - dia) / 864e5);
  const fecha = diff === 0 ? 'Hoy' : diff === 1 ? 'Ayer' : d.toLocaleDateString('es-AR', {day:'2-digit', month:'2-digit'});
  el.textContent = `${fecha}, ${hhmm(d)} hs`;
}

function renderBudget(){
  const sym = S.moneda === 'USD' ? 'USD' : '$';
  $('#budget').innerHTML = `
    <label for="tope">¿Cuánto querés pagar por mes?</label>
    <div class="money"><span>${sym}</span><input id="tope" inputmode="numeric" placeholder="${S.moneda === 'USD' ? 'Ej: 200' : 'Ej: 300.000'}" value="${esc(S.tope)}" aria-label="Cuota máxima en ${S.moneda === 'USD' ? 'dólares' : 'pesos'}"></div>
    <div class="seg" role="group" aria-label="Moneda">
      <button aria-pressed="${S.moneda==='USD'}" data-moneda="USD">Dólares</button>
      <button aria-pressed="${S.moneda==='ARS'}" data-moneda="ARS">Pesos</button>
    </div>
    ${S.tope ? '<button class="clear" data-clear>Borrar</button>' : ''}
    <div class="hint" id="hint"></div>`;
  const inp = $('#tope');
  inp.addEventListener('input', e => {
    const raw = e.target.value.replace(/[^\d]/g, '');
    S.tope = raw ? (+raw).toLocaleString('es-AR') : '';
    e.target.value = S.tope;
    const had = !!$('[data-clear]');
    if (had !== !!S.tope){ renderBudget(); $('#tope').focus(); const v = $('#tope'); v.setSelectionRange(v.value.length, v.value.length); }
    renderList();
  });
}

function renderDolar(){
  const d = S.dolar;
  const etiqueta = {rosario:'blue Rosario', blue:'blue', fijo:'', respaldo:''}[d.fuente];
  $('#dolar').textContent = `$ ${Math.round(d.valor).toLocaleString('es-AR')}${etiqueta ? ' (' + etiqueta + ')' : ''}`;
}

function renderCats(){
  const counts = {};
  S.items.forEach(it => counts[it.cat] = (counts[it.cat] || 0) + 1);
  const cats = CONFIG.ORDEN_CATEGORIAS.filter(c => counts[c]).concat(Object.keys(counts).filter(c => !CONFIG.ORDEN_CATEGORIAS.includes(c)));
  if (!S.cat || !counts[S.cat]) S.cat = cats[0];
  $('#cats').innerHTML = cats.map(c =>
    `<button class="tab" role="tab" aria-selected="${c===S.cat}" data-cat="${esc(c)}">${esc(c)}</button>`).join('');
}

function renderFilters(){
  const inCat = S.items.filter(it => it.cat === S.cat);
  const conds = COND_ORDEN.filter(c => inCat.some(it => it.cond === c));
  if (!conds.includes(S.cond)) S.cond = 'Todos';
  const seg = conds.length > 1
    ? `<div class="seg" role="group" aria-label="Condición">${['Todos', ...conds].map(c =>
        `<button aria-pressed="${c===S.cond}" data-cond="${esc(c)}">${c === 'Todos' ? 'Todos' : c === 'Open box' ? 'Open box' : c + 's'}</button>`).join('')}</div>` : '';
  $('#filters').innerHTML = seg + `<input class="search" id="q" type="search" placeholder="Buscar por modelo, capacidad o color" value="${esc(S.q)}" aria-label="Buscar">`;
  $('#q').addEventListener('input', e => { S.q = e.target.value; renderList(); });
}

function varHTML(it){
  const meta = [it.gb, it.color, it.bat ? `Batería ${it.bat}` : '', it.nota].filter(Boolean).map(esc).join('  |  ');
  return `<div class="var">
    <div class="var-info"><div class="meta">${meta}</div>${wspBtn(it)}</div>
    <div class="plans">${cuotas(it.precio).map(c => `<div class="plan${enTope(c) ? '' : ' off'}">
      <div class="n">${c.n} cuotas</div>
      <div class="u"><small>USD</small>${Math.ceil(c.usd).toLocaleString('es-AR')}</div>
      <div class="a">Aprox ${fmtARS(c.ars).replace('$ ','$')} pesos</div></div>`).join('')}</div>
  </div>`;
}

const WSP_ICON = '<svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2c-1.5 0-3-.4-4.3-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2c0 1.3.9 2.5 1 2.7.1.2 1.8 2.8 4.4 3.9 1.6.7 2.3.8 3.1.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3z"/></svg>';
function wspBtn(it){
  if (!CONFIG.WHATSAPP) return '';
  const cond = {'Sellado':'Nuevo sellado','Open box':'Open box','Usado':'Usado'}[it.cond] || it.cond;
  const lineas = [
    `Equipo: ${it.modelo}`,
    it.gb ? `Capacidad: ${it.gb}` : '',
    `Condición: ${cond}`,
    it.bat ? `Batería: ${it.bat}` : '',
    it.color ? `Colores: ${it.color}` : '',
    'Forma de pago: financiación con DNI'
  ].filter(Boolean);
  const txt = `Hola, me interesa este modelo:\n\n${lineas.join('\n')}`;
  return `<a class="wsp-btn" data-track="${esc([it.modelo, it.gb, '(' + it.cond + ')'].filter(Boolean).join(' '))}" target="_blank" rel="noopener" href="https://wa.me/${CONFIG.WHATSAPP}?text=${encodeURIComponent(txt)}" aria-label="Contactanos por ${esc(it.modelo)} ${esc(it.gb)} por WhatsApp">${WSP_ICON}<span>Contactanos</span></a>`;
}

function renderList(){
  const q = norm(S.q), tope = hayTope();
  const list = S.items.filter(it => it.cat === S.cat
    && (S.cond === 'Todos' || it.cond === S.cond)
    && (!q || norm([it.modelo, it.gb, it.color, it.cond, it.bat].join(' ')).includes(q))
    && (!tope || cuotas(it.precio).some(enTope)));

  const thead = `<div class="thead"><span>Equipo</span>${CONFIG.PLANES.map(p => `<span>${p.n} cuotas</span>`).join('')}</div>`;
  const html = COND_ORDEN.map(cond => {
    const items = list.filter(it => it.cond === cond);
    const unidades = items.reduce((a, it) => a + (it.n || 1), 0);
    if (!items.length) return '';
    const groups = [];
    items.forEach(it => {
      let g = groups.find(g => norm(g.modelo) === norm(it.modelo));
      if (!g) groups.push(g = {modelo: it.modelo, vars: []});
      g.vars.push(it);
    });
    return `<section class="section">
      <div class="section-head"><h2>${COND_TITULO[cond]}</h2><span>${unidades} ${unidades === 1 ? 'equipo disponible' : 'equipos disponibles'}</span></div>
      <div class="table">${thead}${groups.map(g =>
        `<div class="group"><div class="model"><span>${esc(g.modelo)}</span></div>${g.vars.map(varHTML).join('')}</div>`).join('')}</div>
    </section>`;
  }).join('');

  $('#list').innerHTML = html;
  const hint = $('#hint');
  if (hint) hint.textContent = !tope ? '' : list.length
    ? `${list.length === 1 ? 'Hay 1 opción' : 'Hay ' + list.length + ' opciones'} en ${S.cat} con al menos un plan de hasta ${topeTxt()} por mes. Los planes que superan ese monto se ven atenuados.`
    : '';
  $('#state').innerHTML = list.length ? '' : tope
    ? `<div class="empty">No hay equipos de ${esc(S.cat)} con cuotas de hasta ${esc(topeTxt())} por mes. Probá con un monto mayor o revisá otra categoría.</div>`
    : `<div class="empty">No encontramos equipos para “${esc(S.q)}”. Probá con otro modelo o capacidad.</div>`;
}

function renderFooter(){
  const d = S.dolar;
  const fuente = d.fuente === 'rosario' ? 'la cotización del dólar blue en Rosario (precio de venta, InfoDolar)'
    : d.fuente === 'blue' ? 'la cotización del dólar blue (precio de venta)' : 'una cotización de referencia';
  $('#foot').innerHTML = `<h3>Condiciones</h3>
    <p>Financiación exclusiva con DNI en 3, 6 y 12 cuotas, sujeta a aprobación.</p>
    <p>Las cuotas se expresan en dólares. El equivalente en pesos es estimado según ${fuente}${d.hora ? ', actualizada a las ' + d.hora + ' hs' : ''}, y se confirma al momento de la operación.</p>
    <p>Precios y disponibilidad sujetos a cambios sin previo aviso. ${esc(CONFIG.NOMBRE)}, Rosario, Santa Fe.</p>`;
}

function renderAll(){
  $('#bar').hidden = false;
  renderCats(); renderFilters(); renderBudget(); renderList(); renderFooter();
}

document.addEventListener('click', e => {
  const cat = e.target.closest('[data-cat]');
  if (cat){ S.cat = cat.dataset.cat; S.cond = 'Todos'; S.q = ''; renderAll(); return; }
  const cond = e.target.closest('[data-cond]');
  if (cond){ S.cond = cond.dataset.cond; renderFilters(); renderList(); return; }
  const mon = e.target.closest('[data-moneda]');
  if (mon && mon.dataset.moneda !== S.moneda){
    // convierte el monto escrito a la otra moneda
    const v = parseNum(S.tope);
    if (v > 0){
      const nv = mon.dataset.moneda === 'ARS' ? Math.round(v * S.dolar.valor / 1000) * 1000 : Math.round(v / S.dolar.valor);
      S.tope = nv.toLocaleString('es-AR');
    }
    S.moneda = mon.dataset.moneda; renderBudget(); renderList(); return;
  }
  if (e.target.closest('[data-clear]')){ S.tope = ''; renderBudget(); renderList(); return; }
  const w = e.target.closest('[data-track]');
  if (w) track('contacto', w.dataset.track);
});

/* ============================================================
   Carga inicial
   ============================================================ */
function showLoader(msg){
  $('#state').innerHTML = `<div class="drop">
    <p>${msg}</p>
    <label class="btn" style="display:inline-block">Elegir Excel<input type="file" accept=".xlsx,.xls,.csv" id="file" hidden></label>
  </div>`;
  $('#file').addEventListener('change', async e => {
    const f = e.target.files[0]; if (!f) return;
    mostrar(parseWorkbook(XLSX.read(await f.arrayBuffer(), {type:'array'})));
  });
}

function mostrar(items){
  if (!items.length){ showLoader('No se encontraron equipos publicables en la planilla. Revisá que tenga modelo y precio.'); return; }
  S.items = items; $('#state').innerHTML = ''; renderDolar(); renderActualizado(); renderAll();
}

async function desdeAppsScript(){
  const r = await withTimeout(fetch(CONFIG.API_URL), 20000);
  const j = await r.json();
  if (!j.items || !j.items.length) throw new Error('sin datos');
  S.actualizado = j.actualizado;
  S.dolar = CONFIG.DOLAR_FIJO ? {valor: CONFIG.DOLAR_FIJO, fuente: 'fijo'}
    : j.dolar && j.dolar.valor ? {valor: j.dolar.valor, fuente: 'rosario', hora: hhmm(j.dolar.t)}
    : await getDolar();
  return j.items;
}

async function desdeExcel(){
  S.dolar = await getDolar();
  const r = await fetch(CONFIG.ARCHIVO_EXCEL + '?v=' + Date.now(), {cache:'no-store'});
  if (!r.ok) throw new Error(r.status);
  S.actualizado = r.headers.get('Last-Modified');
  return parseWorkbook(XLSX.read(await r.arrayBuffer(), {type:'array'}));
}

(async () => {
  $('#state').innerHTML = '<div class="empty">Cargando equipos…</div>';
  try{ if (!sessionStorage.getItem('farroyo_visita')){ sessionStorage.setItem('farroyo_visita', '1'); track('visita'); } }catch(e){}
  let items = null;
  if (CONFIG.API_URL){ try{ items = await desdeAppsScript(); }catch(e){ console.warn('Apps Script', e); } }
  if (!items){ try{ items = await desdeExcel(); }catch(e){} }
  if (!S.dolar) S.dolar = await getDolar();
  renderDolar();
  if (items) mostrar(items);
  else { $('#actualizado').parentElement.hidden = true;
    showLoader(`No se pudo cargar el stock. Revisá la URL de Apps Script en CONFIG o subí <b>${esc(CONFIG.ARCHIVO_EXCEL)}</b> junto a esta página.`); }
})();

</script>
