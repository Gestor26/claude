<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Farroyo · Herramientas</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--paper:#F1F4EC;--ink:#1B2A22;--ink-2:#4A5A50;--line:#C9D2C3;--green:#1E6B45}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:"IBM Plex Sans",system-ui,sans-serif}
  body{display:flex;flex-direction:column}
  nav{display:flex;align-items:center;gap:4px;padding:0 16px;border-bottom:2px solid var(--ink);background:var(--paper);flex:none}
  nav .brand{font-weight:600;margin-right:18px;font-size:.95rem}
  nav button{font:inherit;background:none;border:0;border-bottom:3px solid transparent;padding:14px 14px 11px;cursor:pointer;color:var(--ink-2);font-weight:500}
  nav button.on{color:var(--ink);border-bottom-color:var(--green)}
  nav button:hover{color:var(--ink)}
  main{flex:1;position:relative;min-height:0}
  iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
  iframe[hidden]{display:none}
</style>
</head>
<body>
<nav>
  <span class="brand">Farroyo</span>
  <button class="on" data-s="cuenta">Cuenta Corriente</button>
  <button data-s="tienda">Store Generator</button>
</nav>
<main>
  <iframe id="f-cuenta" src="cuenta.html" title="Cuenta Corriente"></iframe>
  <iframe id="f-tienda" data-src="tienda/index.html" title="Store Generator" hidden></iframe>
</main>
<script>
  const ir = location.hash.slice(1);
  function show(s){
    document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on', b.dataset.s===s));
    ['cuenta','tienda'].forEach(k=>{ const f=document.getElementById('f-'+k); f.hidden = k!==s; if(k===s && !f.src && f.dataset.src) f.src = f.dataset.src; });
    history.replaceState(null,'','#'+s);
  }
  document.querySelector('nav').addEventListener('click', e=>{ const b=e.target.closest('button'); if(b) show(b.dataset.s); });
  if(ir==='tienda') show('tienda');
</script>
</body>
</html>
